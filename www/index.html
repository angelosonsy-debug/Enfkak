<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#C98A3B">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الانفكاك">
<title>خطة الانفكاك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F1E6; --paper:#FBF9F3; --ink:#22291F; --ink-soft:#5A6152;
    --tension:#8B3A2A; --calm:#4A7C6F; --amber:#C98A3B;
    --line:#DCD3BC; --line-strong:#B9AD8E; --gold:#B98A2E;
  }
  [data-theme="dark"]{
    --bg:#181C15; --paper:#20261C; --ink:#EDE9DD; --ink-soft:#9CA38C;
    --tension:#C15A42; --calm:#5FA093; --amber:#D9A15C;
    --line:#333A2B; --line-strong:#454E39; --gold:#D9A94A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg);
    background-image: linear-gradient(var(--line) 1px, transparent 1px);
    background-size: 100% 42px; color:var(--ink);
    font-family:'IBM Plex Sans Arabic', sans-serif; padding:0 0 60px;
    transition:background-color .2s, color .2s;
  }
  .wrap{max-width:780px;margin:0 auto;padding:0 20px;}

  header{padding:36px 0 18px;position:relative;}
  .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .eyebrow{font-size:12px;letter-spacing:.12em;color:var(--ink-soft);text-transform:uppercase;font-weight:600;margin-bottom:6px;}
  h1{font-family:'Cairo',sans-serif;font-weight:900;font-size:34px;margin:0 0 6px;line-height:1.15;}
  .sub{color:var(--ink-soft);font-size:15px;margin-bottom:22px;}
  .theme-btn{
    background:var(--paper);border:1px solid var(--line-strong);border-radius:8px;
    padding:8px 12px;font-size:15px;cursor:pointer;color:var(--ink);flex-shrink:0;margin-top:4px;
  }

  .gauge{display:flex;gap:3px;height:38px;margin-bottom:6px;}
  .gcell{flex:1;border-radius:3px;position:relative;cursor:pointer;overflow:hidden;transition:transform .15s ease;background:#E4DDC9;display:flex;align-items:flex-end;justify-content:center;}
  .gcell:hover{transform:translateY(-3px);}
  .gcell .fill{position:absolute;inset:auto 0 0 0;transition:height .2s;}
  .gcell .num{position:relative;z-index:1;font-family:'Cairo',sans-serif;font-weight:800;font-size:12px;padding-bottom:3px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25);}
  .gauge-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);margin-bottom:22px;}

  .dashboard{
    display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line-strong);
    border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;margin-bottom:16px;
  }
  .dstat{background:var(--paper);padding:14px 10px;text-align:center;}
  .dstat .num{font-family:'Cairo',sans-serif;font-weight:900;font-size:20px;}
  .dstat .lbl{font-size:11px;color:var(--ink-soft);margin-top:3px;line-height:1.3;}

  .banner{border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:13.5px;display:flex;align-items:center;gap:10px;justify-content:space-between;}
  .banner.reward{background:linear-gradient(90deg, var(--gold), var(--amber));color:#fff;font-weight:600;}
  .banner.alert{background:var(--paper);border:1px solid var(--line-strong);color:var(--ink);}
  .banner button{background:rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.4);color:inherit;border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit;flex-shrink:0;}
  .banner.alert button{background:var(--ink);color:var(--bg);border:none;}

  .day{background:var(--paper);border:1px solid var(--line-strong);border-radius:12px;margin-bottom:14px;overflow:hidden;border-inline-start:5px solid var(--phase-color, var(--ink-soft));}
  .day-head{display:flex;align-items:center;gap:12px;padding:16px 18px;cursor:pointer;user-select:none;}
  .day-num{font-family:'Cairo',sans-serif;font-weight:900;font-size:22px;color:var(--phase-color);min-width:34px;}
  .day-title{flex:1;min-width:0;}
  .day-title .name{font-weight:600;font-size:16px;}
  .day-title .meta{font-size:11.5px;color:var(--ink-soft);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;}

  .progress-badge{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .progress-track{width:52px;height:6px;background:var(--line);border-radius:4px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--calm);border-radius:4px;transition:width .25s;}
  .progress-pct{font-family:'Cairo',sans-serif;font-weight:800;font-size:12px;min-width:32px;text-align:left;color:var(--ink-soft);}

  .chevron{color:var(--ink-soft);transition:transform .2s;font-size:12px;}
  .day.open .chevron{transform:rotate(180deg);}
  .day-body{max-height:0;overflow:hidden;transition:max-height .35s ease;}
  .day.open .day-body{max-height:2200px;}
  .day-inner{padding:0 18px 20px;}

  .section-label{font-size:11.5px;color:var(--ink-soft);font-weight:600;margin:16px 0 8px;text-transform:uppercase;letter-spacing:.05em;}
  .section-label:first-child{margin-top:0;}

  .tasks{display:flex;flex-direction:column;gap:6px;}
  .task{display:flex;align-items:center;gap:9px;background:var(--bg);border-radius:8px;padding:9px 12px;font-size:13.5px;}
  .task .cb{width:19px;height:19px;border-radius:5px;border:2px solid var(--line-strong);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;background:var(--paper);transition:transform .15s;}
  .task .cb.checked{background:var(--calm);border-color:var(--calm);}
  .task .cb.pop{animation:pop .3s ease;}
  @keyframes pop{0%{transform:scale(1);}45%{transform:scale(1.35);}100%{transform:scale(1);}}
  .task .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .task .prio{cursor:pointer;font-size:12px;flex-shrink:0;}
  .task .txt{flex:1;cursor:pointer;}
  .task.done .txt{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--line-strong);}
  .task .del{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:15px;padding:2px 4px;opacity:.5;flex-shrink:0;}
  .task .del:hover{opacity:1;color:var(--tension);}
  .task .edit{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:13px;padding:2px 4px;opacity:.5;flex-shrink:0;}
  .task .edit:hover{opacity:1;color:var(--calm);}
  .dot.sleep{background:#4A5A7C;} .dot.study{background:var(--amber);}
  .dot.rest{background:var(--calm);} .dot.fun{background:#B25B8F;} .dot.out{background:var(--tension);} .dot.custom{background:var(--ink-soft);}

  .add-task{display:flex;gap:8px;margin-top:10px;}
  .add-task input{flex:1;border:1px solid var(--line-strong);background:var(--paper);border-radius:8px;padding:8px 12px;font-size:13.5px;font-family:'IBM Plex Sans Arabic',sans-serif;color:var(--ink);}
  .add-task select{border:1px solid var(--line-strong);background:var(--paper);border-radius:8px;padding:0 8px;font-size:12.5px;color:var(--ink);font-family:'IBM Plex Sans Arabic',sans-serif;}
  .add-task input:focus{outline:2px solid var(--calm);outline-offset:1px;}
  .add-task button{background:var(--ink);color:var(--bg);border:none;border-radius:8px;padding:0 16px;font-size:13px;cursor:pointer;font-family:'Cairo',sans-serif;font-weight:700;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
  .chip{background:var(--bg);border:1px solid var(--line);color:var(--ink-soft);border-radius:20px;padding:4px 12px;font-size:12px;cursor:pointer;}
  .chip:hover{border-color:var(--line-strong);color:var(--ink);}

  .sleep-box{display:flex;flex-wrap:wrap;gap:14px;align-items:center;background:var(--bg);border-radius:8px;padding:12px;}
  .sleep-field{display:flex;flex-direction:column;gap:5px;}
  .sleep-field label{font-size:11px;color:var(--ink-soft);}
  .sleep-field input[type=number]{width:70px;border:1px solid var(--line-strong);background:var(--paper);border-radius:6px;padding:5px 8px;font-size:13px;color:var(--ink);font-family:inherit;}
  .stars{display:flex;gap:2px;}
  .stars span{cursor:pointer;font-size:17px;color:var(--line-strong);}
  .stars span.on{color:var(--gold);}

  .mood-row{display:flex;gap:8px;}
  .mood-row button{background:var(--bg);border:1px solid var(--line);border-radius:8px;font-size:19px;padding:6px 10px;cursor:pointer;}
  .mood-row button.active{background:var(--calm);border-color:var(--calm);}

  /* goals */
  .goals-box{background:var(--paper);border:1px solid var(--line-strong);border-radius:12px;padding:16px 18px;margin-bottom:16px;}
  .goals-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
  .goal-card{background:var(--bg);border-radius:8px;padding:12px 14px;}
  .goal-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;}
  .goal-label{font-size:13.5px;font-weight:600;}
  .goal-meta{font-size:12px;color:var(--ink-soft);margin-top:6px;display:flex;align-items:center;gap:6px;}
  .goal-meta input[type=number]{border:1px solid var(--line-strong);background:var(--paper);border-radius:6px;padding:4px 6px;font-size:12px;color:var(--ink);font-family:inherit;}
  .goal-add{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
  .goal-add select, .goal-add input{border:1px solid var(--line-strong);background:var(--paper);border-radius:8px;padding:7px 10px;font-size:12.5px;color:var(--ink);font-family:inherit;}
  .goal-add button{background:var(--ink);color:var(--bg);border:none;border-radius:8px;padding:0 16px;font-size:13px;cursor:pointer;font-family:'Cairo',sans-serif;font-weight:700;}

  /* timer */
  .timer-box{background:var(--paper);border:1px solid var(--line-strong);border-radius:12px;padding:16px 18px;margin-bottom:16px;}
  .timer-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
  .timer-row select{border:1px solid var(--line-strong);background:var(--bg);border-radius:8px;padding:7px 10px;font-size:12.5px;color:var(--ink);font-family:inherit;}
  .timer-display{font-family:'Cairo',sans-serif;font-weight:800;font-size:18px;min-width:56px;text-align:center;background:var(--bg);border-radius:8px;padding:6px 10px;}
  .timer-row button{border:none;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;font-family:'Cairo',sans-serif;font-weight:700;}
  .timer-start{background:var(--calm);color:#fff;}
  .timer-stop{background:var(--tension);color:#fff;}
  .timer-log{font-size:11.5px;color:var(--ink-soft);margin-top:8px;}

  /* backup */
  .backup-box{margin-top:14px;}
  .backup-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;}
  .backup-area{width:100%;max-width:600px;min-height:70px;margin-top:8px;border:1px solid var(--line-strong);background:var(--paper);border-radius:8px;padding:8px 10px;font-size:11px;color:var(--ink-soft);font-family:monospace;resize:vertical;}

  .insights-list{margin:0;padding-inline-start:18px;font-size:13px;line-height:1.9;color:var(--ink);}
  .insights-list li{margin-bottom:2px;}

  .mode-switch-box{background:var(--paper);border:1px solid var(--line-strong);border-radius:12px;padding:14px 18px;margin:20px 0 18px;}
  .mode-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  .mode-current{font-family:'Cairo',sans-serif;font-weight:800;font-size:16px;}
  .mode-sub{font-family:'IBM Plex Sans Arabic',sans-serif;font-weight:400;font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .mode-actions button{background:var(--ink);color:var(--bg);border:none;border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer;font-family:'Cairo',sans-serif;font-weight:700;}
  .mode-links{display:flex;gap:14px;margin-top:10px;}
  .mode-link{font-size:11.5px;color:var(--ink-soft);text-decoration:none;border-bottom:1px dashed var(--line-strong);}

  .checkin{border-top:1px dashed var(--line-strong);padding-top:14px;margin-top:16px;}
  .checkin-title{font-size:12px;color:var(--ink-soft);margin-bottom:10px;font-weight:600;}
  .q{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px;}
  .q .qtxt{font-size:13.5px;}
  .yn{display:flex;gap:6px;flex-shrink:0;}
  .yn button{border:1px solid var(--line-strong);background:var(--paper);border-radius:6px;padding:4px 12px;font-size:12px;cursor:pointer;font-family:'IBM Plex Sans Arabic',sans-serif;color:var(--ink-soft);}
  .yn button.active-yes{background:var(--calm);border-color:var(--calm);color:#fff;}
  .yn button.active-no{background:var(--tension);border-color:var(--tension);color:#fff;}

  .note{font-size:12.5px;color:var(--ink-soft);background:var(--bg);border-radius:8px;padding:10px 12px;margin-top:14px;}
  .note.warn{border:1px dashed var(--amber);}

  .report{background:var(--paper);border:1px solid var(--line-strong);border-radius:12px;padding:18px;margin-top:24px;}
  .report h2{font-family:'Cairo',sans-serif;font-size:19px;margin:0 0 14px;}
  .report-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
  .rline{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:12.5px;}
  .rline b{display:block;font-family:'Cairo',sans-serif;font-size:14px;margin-top:2px;}
  .chart-block{margin-bottom:16px;}
  .chart-block .clabel{font-size:11.5px;color:var(--ink-soft);margin-bottom:6px;font-weight:600;}
  .mood-chart{display:flex;gap:4px;}
  .mood-chart .mc{flex:1;text-align:center;font-size:16px;background:var(--bg);border-radius:6px;padding:6px 0;}

  footer{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:30px;}
  .reset{background:none;border:1px solid var(--line-strong);color:var(--ink-soft);border-radius:6px;padding:5px 12px;font-size:11.5px;cursor:pointer;margin-top:10px;}

  @media (max-width:480px){
    .dashboard{grid-template-columns:repeat(2,1fr);}
    .report-grid{grid-template-columns:1fr;}
    h1{font-size:27px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="mode-switch-box" id="modeSwitchBox"></div>

  <div id="vacationContainer">
  <header>
    <div class="top-row">
      <div>
        <div class="eyebrow">إجازة ٤٠٩ / ١٠ أيام</div>
        <h1>خطة الانفكاك</h1>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="theme-btn" id="notifBtn" title="تفعيل التنبيهات">🔔</button>
        <button class="theme-btn" id="themeBtn">🌙</button>
      </div>
    </div>
    <div class="sub">من ضغط التمام لحد يوم السفر — علّم مهامك وشوف نسبة إنجاز كل يوم.</div>

    <div class="gauge" id="gauge"></div>
    <div class="gauge-labels"><span>تصفير</span><span>إيقاع</span><span>استمتاع</span><span>سفر</span></div>

    <div class="dashboard" id="dashboard"></div>
    <div id="banners"></div>
  </header>

  <div class="goals-box" id="goalsSection"></div>

  <div class="timer-box" id="timerWidget"></div>

  <div id="days"></div>

  <div class="report" id="report"></div>

  <div style="text-align:center;margin-top:16px;">
    <button class="reset" id="archiveVacationBtn">أرشفة الإجازة والبدء من جديد</button>
  </div>
  </div>
  <!-- /vacationContainer -->

  <div id="armyContainer" style="display:none">
    <div class="goals-box">
      <div class="top-row">
        <div>
          <div class="eyebrow">دورة الجيش</div>
          <h1 style="font-size:26px;">وضع الجيش 🪖</h1>
        </div>
        <div style="display:flex;gap:8px;">
          <button class="theme-btn" id="notifBtnArmy" title="تفعيل التنبيهات">🔔</button>
          <button class="theme-btn" id="themeBtnArmy">🌙</button>
        </div>
      </div>
      <div class="section-label" style="margin-top:10px;">أنت في يوم كام؟</div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <input type="number" id="armyCurrentDayInput" min="1" max="20" style="width:70px;border:1px solid var(--line-strong);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--ink);font-family:inherit;"/>
        <span style="font-size:12.5px;color:var(--ink-soft)">من 20 — عدّلها كل يوم بنفسك</span>
      </div>
      <div class="gauge" id="armyGauge" style="margin-top:14px;"></div>
    </div>

    <div class="dashboard" id="armyDashboard"></div>
    <div id="armyBanners"></div>

    <div class="goals-box" id="armyGoalsSection"></div>

    <div class="day" id="armyDayCard"></div>

    <div style="text-align:center;margin-top:16px;">
      <button class="reset" id="archiveArmyBtn">أرشفة دورة الجيش والبدء من جديد</button>
    </div>
  </div>
  <!-- /armyContainer -->

  <div class="report" id="unifiedStats"></div>
  <div class="report" id="archiveBox"></div>

  <footer>
    تقدّمك محفوظ تلقائيًا على جهازك.
    <br>
    <button class="reset" id="resetBtn">تصفير كل البيانات</button>

    <div class="backup-box">
      <div class="backup-row">
        <button class="reset" id="exportBtn">تصدير نسخة احتياطية (JSON)</button>
        <button class="reset" id="importBtn">استيراد نسخة احتياطية</button>
      </div>
      <textarea id="backupArea" class="backup-area" placeholder="هنا هيظهر نص النسخة الاحتياطية بعد التصدير — أو الصقه هنا عشان تستورد نسخة قديمة"></textarea>
    </div>
  </footer>
</div>

<script>
/* ============================= DATA / CONFIG ============================= */

const PHASES = {
  reset:  {color:'#8B3A2A', label:'تصفير'},
  rhythm: {color:'#C98A3B', label:'إيقاع'},
  joy:    {color:'#4A7C6F', label:'استمتاع'},
  travel: {color:'#4A5A7C', label:'سفر'}
};

const ENERGY = {1:'rest',2:'rest',3:'high',4:'high',5:'high',6:'high',7:'medium',8:'medium',9:'medium',10:'travel'};
const ENERGY_META = {
  rest:   {label:'راحة',        icon:'😌'},
  high:   {label:'طاقة عالية',  icon:'⚡'},
  medium: {label:'طاقة متوسطة', icon:'🙂'},
  travel: {label:'سفر',         icon:'✈️'}
};

const PRIORITY_META = {high:{icon:'🔴',label:'أساسية'}, medium:{icon:'🟡',label:'متوسطة'}, low:{icon:'🟢',label:'اختيارية'}};
const PRIORITY_ORDER = ['high','medium','low'];
function nextPriority(p){ const i = PRIORITY_ORDER.indexOf(p); return PRIORITY_ORDER[(i+1)%3]; }

const TAG_LABEL = {sleep:'نوم', study:'مذاكرة', rest:'راحة', fun:'ترفيه', out:'خروج', custom:'مهمة'};
const TAG_HOURS = {study:1.5, rest:0.5, fun:1, out:1.5, custom:1};

const MOOD_OPTIONS = [
  {k:'great', e:'😀', label:'ممتاز'},
  {k:'good',  e:'🙂', label:'جيد'},
  {k:'ok',    e:'😐', label:'عادي'},
  {k:'tired', e:'😔', label:'مرهق'},
  {k:'bad',   e:'😫', label:'سيئ'}
];

// tasks: [tag, text, priority]
const DAY_DEFS = [
  {n:1, phase:'reset', name:'التصفير الكامل', tasks:[
    ['rest','حمام طويل + أكلة بتحبها','medium'],
    ['out','قعدة أهل بسيطة من غير إرهاق','medium'],
    ['fun','ترفيه هادي بالليل','low'],
  ]},
  {n:2, phase:'reset', name:'استمرار التفريغ', tasks:[
    ['out','مشوار أو خروجة خفيفة برا الروتين','medium'],
    ['rest','قيلولة لو حسيت إنك محتاجها','low'],
    ['fun','قعدة أو سهرة أصحاب','low'],
  ]},
  {n:3, phase:'rhythm', name:'أول يوم شغل حقيقي', tasks:[
    ['study','ساعة - ساعة ونص مذاكرة','high'],
    ['rest','أكل + قيلولة قصيرة','medium'],
    ['out','مشوار أو حاجة شخصية كنت مأجلها','medium'],
    ['fun','وقت أهل أو ترفيه هادي بالليل','low'],
  ]},

/* ============================= STATE ============================= */

let state = {};
let idCounter = 1;

/* Storage adapter: uses Claude's window.storage when available (inside claude.ai),
   falls back to the browser's localStorage otherwise (standalone PWA / Android install). */
const Storage = {
  async get(key, shared){
    if(window.storage) return window.storage.get(key, shared);
    try{
      const v = localStorage.getItem(key);
      return v!=null ? {key, value:v, shared:!!shared} : null;
    }catch(e){ return null; }
  },
  async set(key, value, shared){
    if(window.storage) return window.storage.set(key, value, shared);
    try{ localStorage.setItem(key, value); return {key, value, shared:!!shared}; }
    catch(e){ return null; }
  }
};

function defaultDayState(def){
  return {
    open:false,
    q:{},
    mood:null,
    sleep:{hours:null, quality:null, rested:null},
    tasks: def.tasks.map(([tag,txt,priority])=>({id:'t'+(idCounter++), tag, txt, priority:priority||'medium', done:false}))
  };
}

function defaultArmyDay(){
  return {
    tasks: ARMY_TASKS_TEMPLATE.map(t=>({key:t.key, done:false})),
    sleepHours: null,
    mood: null,
    energy: null,
    review: {finishedDay:null, sleptWell:null, didReview:null, goodMood:null, needsAdjust:null}
  };
}
function defaultArmyState(){
  const days = {};
  for(let i=1;i<=ARMY_TOTAL_DAYS;i++) days[i] = defaultArmyDay();
  return {currentDay:1, openDay:1, days, goals:[]};
}

function normalizeState(){
  state = state || {};
  DAY_DEFS.forEach(def=>{
    if(!state[def.n]) state[def.n] = defaultDayState(def);
    const d = state[def.n];
    if(!d.tasks) d.tasks = defaultDayState(def).tasks;
    if(!d.q) d.q = {};
    if(!d.sleep) d.sleep = {hours:null,quality:null,rested:null};
    if(d.mood===undefined) d.mood = null;
    d.tasks.forEach(t=>{ if(!t.priority) t.priority='medium'; });
    d.tasks.forEach(t=>{
      const num = parseInt((t.id||'t0').slice(1));
      if(!isNaN(num) && num>=idCounter) idCounter = num+1;
    });
  });
  if(!Array.isArray(state.goals)) state.goals = [];
  state.goals.forEach(g=>{
    const num = parseInt((g.id||'g0').slice(1));
    if(!isNaN(num) && num>=idCounter) idCounter = num+1;
  });
  if(!Array.isArray(state.timerSessions)) state.timerSessions = [];
  state.timerSessions.forEach(s=>{
    const num = parseInt((s.id||'s0').slice(1));
    if(!isNaN(num) && num>=idCounter) idCounter = num+1;
  });

  /* --- army / archive / mode --- */
  if(!state.mode) state.mode = 'vacation';
  if(!state.army) state.army = defaultArmyState();
  if(!state.army.days) state.army.days = defaultArmyState().days;
  for(let i=1;i<=ARMY_TOTAL_DAYS;i++){ if(!state.army.days[i]) state.army.days[i] = defaultArmyDay(); }
  if(!Array.isArray(state.army.goals)) state.army.goals = [];
  if(state.army.currentDay==null) state.army.currentDay = 1;
  if(state.army.openDay==null) state.army.openDay = state.army.currentDay;
  state.army.goals.forEach(g=>{
    const num = parseInt((g.id||'g0').slice(1));
    if(!isNaN(num) && num>=idCounter) idCounter = num+1;
  });
  if(!Array.isArray(state.archive)) state.archive = [];
  state.archive.forEach(a=>{
    const num = parseInt((a.id||'ar0').slice(2));
    if(!isNaN(num) && num>=idCounter) idCounter = num+1;
  });
  if(!state.cycleLabels) state.cycleLabels = {army:1, vacation:1};
  if(state.notificationsEnabled===undefined) state.notificationsEnabled = false;
}

async function loadState(){
  let loaded = null;
  try{
    const r3 = await Storage.get('vacation-state-v3', false);
    if(r3 && r3.value) loaded = JSON.parse(r3.value);
  }catch(e){ /* no v3 yet */ }

  if(!loaded){
    // try migrating older version so nothing gets lost
    try{
      const r2 = await Storage.get('vacation-state-v2', false);
      if(r2 && r2.value){
        const old = JSON.parse(r2.value);
        loaded = {};
        Object.keys(old).forEach(n=>{
          const od = old[n];
          loaded[n] = {
            open: od.open||false,
            q: od.q||{},
            mood:null,
            sleep:{hours:null,quality:null,rested:null},
            tasks:(od.tasks||[]).map(t=>({id:t.id, tag:t.tag, txt:t.txt, done:!!t.done, priority: t.priority || (t.tag==='study'?'high':(t.tag==='fun'?'low':'medium'))}))
          };
        });
      }
    }catch(e){ /* no v2 either */ }
  }

  state = loaded || {};
  normalizeState();
}
async function saveState(){
  try{ await Storage.set('vacation-state-v3', JSON.stringify(state), false); }
  catch(e){ console.error('save failed', e); }
}

/* ============================= COMPUTED HELPERS ============================= */

function dayPct(n){
  const tasks = state[n].tasks;
  if(!tasks.length) return 0;
  return Math.round(tasks.filter(t=>t.done).length/tasks.length*100);
}
function essentialOk(n){
  const essential = state[n].tasks.filter(t=>t.priority==='high');
  if(!essential.length) return true;
  return essential.filter(t=>t.done).length/essential.length > 0.5;
}
function dayGoodQCount(n){
  const q = state[n].q || {};
  return QUESTIONS.filter(x=>q[x.k]===true).length;
}
function isDayGood(n){
  return dayPct(n) >= 70 && essentialOk(n) && dayGoodQCount(n) >= 2;
}
function isDayInteracted(n){
  const d = state[n];
  return d.tasks.some(t=>t.done) || Object.values(d.q||{}).some(v=>v!==undefined) ||
         d.sleep.hours!=null || d.sleep.quality!=null || d.sleep.rested!=null || d.mood!=null;
}
function overallPct(){
  const all = DAY_DEFS.map(d=>dayPct(d.n));
  return Math.round(all.reduce((a,b)=>a+b,0)/all.length);
}
function computeDashboardStats(){
  let tasksDone=0, tasksTotal=0, studyDone=0, restDone=0, outDone=0;
  const tagDone = {study:0, rest:0, fun:0, out:0, custom:0};
  const tagTotal = {study:0, rest:0, fun:0, out:0, custom:0};
  DAY_DEFS.forEach(d=>{
    state[d.n].tasks.forEach(t=>{
      tasksTotal++;
      tagTotal[t.tag] = (tagTotal[t.tag]||0)+1;
      if(t.done){
        tasksDone++;
        tagDone[t.tag] = (tagDone[t.tag]||0)+1;
        if(t.tag==='study') studyDone++;
        if(t.tag==='rest') restDone++;
        if(t.tag==='out') outDone++;
      }
    });
  });
  let timerMinutesByTag = {study:0, rest:0, fun:0, out:0, custom:0};
  (state.timerSessions||[]).forEach(s=>{
    timerMinutesByTag[s.tag] = (timerMinutesByTag[s.tag]||0) + s.minutes;
  });
  const totalTimerMinutes = Math.round(Object.values(timerMinutesByTag).reduce((a,b)=>a+b,0));

  const recordedDays = DAY_DEFS.filter(d=>isDayInteracted(d.n)).length;
  const goodDays = DAY_DEFS.filter(d=>isDayGood(d.n)).length;
  let streak=0, maxStreak=0;
  DAY_DEFS.forEach(d=>{ if(isDayGood(d.n)){streak++; maxStreak=Math.max(maxStreak,streak);} else streak=0; });

  const sleepVals = DAY_DEFS.filter(d=>state[d.n].sleep.hours!=null).map(d=>state[d.n].sleep.hours);
  const avgSleep = sleepVals.length ? Math.round(sleepVals.reduce((a,b)=>a+b,0)/sleepVals.length*10)/10 : 0;

  return {
    vacationElapsedPct: Math.round(recordedDays/DAY_DEFS.length*100),
    overallPct: overallPct(),
    tasksDone, tasksRemaining: tasksTotal-tasksDone,
    studyHours: Math.round((studyDone*TAG_HOURS.study + timerMinutesByTag.study/60)*10)/10,
    restHours: Math.round((restDone*TAG_HOURS.rest + timerMinutesByTag.rest/60)*10)/10,
    outCount: outDone,
    goodDays, maxStreak, recordedDays,
    tagDone, tagTotal, points: goodDays*10,
    avgSleep, totalTimerMinutes
  };
}

function armyDayTasksDoneCount(n){ return state.army.days[n].tasks.filter(t=>t.done).length; }
function isArmyDayGood(n){ return armyDayTasksDoneCount(n) >= 3; }
function isArmyDayInteracted(n){
  const d = state.army.days[n];
  return d.tasks.some(t=>t.done) || d.sleepHours!=null || d.mood!=null || d.energy!=null ||
         Object.values(d.review).some(v=>v!==null && v!==undefined);
}
function computeArmyStats(){
  let recorded=0, good=0, streak=0, maxStreak=0, reviewCount=0, socialCount=0, tasksDone=0;
  const sleepVals=[];
  for(let i=1;i<=ARMY_TOTAL_DAYS;i++){
    const d = state.army.days[i];
    if(isArmyDayInteracted(i)) recorded++;
    if(isArmyDayGood(i)){ good++; streak++; maxStreak=Math.max(maxStreak,streak); } else streak=0;
    if(d.review.didReview===true) reviewCount++;
    const socialTask = d.tasks.find(t=>t.key==='social');
    if(socialTask && socialTask.done) socialCount++;
    tasksDone += d.tasks.filter(t=>t.done).length;
    if(d.sleepHours!=null) sleepVals.push(d.sleepHours);
  }
  const avgSleep = sleepVals.length ? Math.round(sleepVals.reduce((a,b)=>a+b,0)/sleepVals.length*10)/10 : 0;
  return {
    recorded, good, maxStreak, reviewCount, socialCount, tasksDone, avgSleep,
    remainingToVacation: Math.max(0, ARMY_TOTAL_DAYS - state.army.currentDay),
    successPct: Math.round(good/ARMY_TOTAL_DAYS*100)
  };
}

/* --- army goals --- */
function computeArmyGoalProgress(g, aStats){
  if(g.kind==='custom' && g.mode==='boolean'){
    return {pct:g.done?100:0, done:!!g.done, displayCurrent:g.done?'تم':'لسه', displayTarget:''};
  }
  if(g.kind==='review_count'){
    const pct = g.target>0 ? Math.min(100, Math.round(aStats.reviewCount/g.target*100)) : 0;
    return {pct, done:pct>=100, displayCurrent:aStats.reviewCount+' مرة', displayTarget:g.target+' مرة'};
  }
  if(g.kind==='sleep_avg'){
    const target = g.target||7;
    const pct = aStats.avgSleep>0 ? Math.min(100, Math.round(aStats.avgSleep/target*100)) : 0;
    return {pct, done: aStats.avgSleep>0 && aStats.avgSleep>=target, displayCurrent:aStats.avgSleep+' س', displayTarget:target+' س'};
  }
  if(g.kind==='social'){
    const pct = g.target>0 ? Math.min(100, Math.round(aStats.socialCount/g.target*100)) : 0;
    return {pct, done:pct>=100, displayCurrent:aStats.socialCount+' مرة', displayTarget:g.target+' مرة'};
  }
  if(g.kind==='custom' && g.mode==='numeric'){
    const pct = g.target>0 ? Math.min(100, Math.round((g.current||0)/g.target*100)) : 0;
    return {pct, done:pct>=100, displayCurrent:g.current||0, displayTarget:g.target};
  }
  return {pct:0, done:false, displayCurrent:'', displayTarget:''};
}
function addArmyGoal(kind, label, target, mode){

  if(kind==='custom'){
    if(mode==='numeric') state.army.goals.push({id, kind:'custom', mode:'numeric', label: label||'هدف مخصص', target:target||1, current:0});
    else state.army.goals.push({id, kind:'custom', mode:'boolean', label: label||'هدف مخصص', done:false});
  }else{
    state.army.goals.push({id, kind, label: ARMY_GOAL_TYPES[kind].label, target: target || (kind==='sleep_avg'?7:5)});
  }
  render(); saveState();
}
function deleteArmyGoal(id){ state.army.goals = state.army.goals.filter(g=>g.id!==id); render(); saveState(); }
function toggleArmyGoalDone(id){ const g=state.army.goals.find(g=>g.id===id); if(g){ g.done=!g.done; render(); saveState(); } }
function setArmyCustomGoalCurrent(id, val){
  const g = state.army.goals.find(g=>g.id===id);

function computeArmyGoalsSummary(aStats){
  if(!state.army.goals.length) return {total:0, achieved:0, pct:0};
  let achieved=0;
  state.army.goals.forEach(g=>{ if(computeArmyGoalProgress(g, aStats).done) achieved++; });
  return {total: state.army.goals.length, achieved, pct: Math.round(achieved/state.army.goals.length*100)};
}

function computeGoalProgress(g, stats){
  if(g.kind==='course' || g.kind==='book' || (g.kind==='custom' && g.mode==='boolean')){
    return {pct: g.done?100:0, done: !!g.done, displayCurrent: g.done?'تم':'لسه', displayTarget:''};
  }
  if(g.kind==='study_hours'){
    const pct = g.target>0 ? Math.min(100, Math.round(stats.studyHours/g.target*100)) : 0;
    return {pct, done: pct>=100, displayCurrent: stats.studyHours+' س', displayTarget: g.target+' س'};
  }
  if(g.kind==='social'){
    const pct = g.target>0 ? Math.min(100, Math.round(stats.outCount/g.target*100)) : 0;
    return {pct, done: pct>=100, displayCurrent: stats.outCount+' مرة', displayTarget: g.target+' مرة'};
  }
  if(g.kind==='sleep_avg'){
    const target = g.target||8;
    const pct = stats.avgSleep>0 ? Math.min(100, Math.round(stats.avgSleep/target*100)) : 0;
    return {pct, done: stats.avgSleep>0 && stats.avgSleep>=target, displayCurrent: stats.avgSleep+' س', displayTarget: target+' س'};
  }
  if(g.kind==='custom' && g.mode==='numeric'){
    const pct = g.target>0 ? Math.min(100, Math.round((g.current||0)/g.target*100)) : 0;
    return {pct, done: pct>=100, displayCurrent:(g.current||0), displayTarget:g.target};
  }
  return {pct:0, done:false, displayCurrent:'', displayTarget:''};
}
function computeGoalsSummary(stats){
  if(!state.goals.length) return {total:0, achieved:0, pct:0};
  let achieved=0;
  state.goals.forEach(g=>{ if(computeGoalProgress(g, stats).done) achieved++; });
  return {total: state.goals.length, achieved, pct: Math.round(achieved/state.goals.length*100)};
}

/* --- timer --- */
let timerRunning = false;
let timerStartTs = null;
let timerDay = 1;
let timerTag = 'study';
let timerIntervalId = null;

function formatElapsed(ms){
  const totalSec = Math.floor(ms/1000);
  const m = String(Math.floor(totalSec/60)).padStart(2,'0');
  const s = String(totalSec%60).padStart(2,'0');
  return m+':'+s;
}
function updateTimerDisplay(){
  const disp = document.getElementById('timerDisplay');
  if(!disp || !timerRunning || !timerStartTs) return;
  disp.textContent = formatElapsed(Date.now()-timerStartTs);
}
function startTimer(){
  timerRunning = true;
  timerStartTs = Date.now();
  if(timerIntervalId) clearInterval(timerIntervalId);
  timerIntervalId = setInterval(updateTimerDisplay, 1000);
  renderTimer();
}
function stopTimer(){
  if(!timerRunning) return;
  const minutes = Math.round((Date.now()-timerStartTs)/60000*10)/10;
  timerRunning = false;
  clearInterval(timerIntervalId);
  timerIntervalId = null;
  if(minutes > 0){
    state.timerSessions.push({id:'s'+(idCounter++), day:timerDay, tag:timerTag, minutes, ts:Date.now()});
    saveState();
  }
  render();
}
function setAnswer(n, key, val){
  if(!state[n].q) state[n].q = {};
  state[n].q[key] = (state[n].q[key]===val) ? undefined : val;
  render(); saveState();
}
function setSleepHours(n, val){
  const v = val===''? null : Math.max(0, Math.min(16, parseFloat(val)));
  state[n].sleep.hours = isNaN(v)? null : v;
  render(); saveState();
}
function setSleepQuality(n, val){ state[n].sleep.quality = (state[n].sleep.quality===val)? null : val; render(); saveState(); }
function setSleepRested(n, val){ state[n].sleep.rested = (state[n].sleep.rested===val)? null : val; render(); saveState(); }
function setMood(n, k){ state[n].mood = (state[n].mood===k)? null : k; render(); saveState(); }

/* ============================= RENDER: UNIFIED STATS + ARCHIVE ============================= */

function renderUnifiedStats(vStats, aStats){
  const el = document.getElementById('unifiedStats');
  if(!el) return;
  const combinedStreak = Math.max(vStats.maxStreak, aStats.maxStreak);
  const totalTasksDone = vStats.tasksDone + aStats.tasksDone;
  const totalGoalsDone = computeGoalsSummary(vStats).achieved + computeArmyGoalsSummary(aStats).achieved;
  const sleepVals = [];
  if(vStats.avgSleep>0) sleepVals.push(vStats.avgSleep);
  if(aStats.avgSleep>0) sleepVals.push(aStats.avgSleep);
  const avgSleepCombined = sleepVals.length ? Math.round(sleepVals.reduce((a,b)=>a+b,0)/sleepVals.length*10)/10 : 0;
  const balancePct = Math.round((vStats.overallPct + aStats.successPct)/2);

  let verdict;
  if(balancePct>=70) verdict='التوازن العام كويس — كمّل بنفس الإيقاع.';
  else if(balancePct>=40) verdict='التوازن العام متوسط — ممكن تحسّنه بخطوات بسيطة.';
  else verdict='التوازن العام محتاج اهتمام أكتر — ابدأ بحاجة صغيرة واحدة بس.';

  const moreConsistent = aStats.successPct >= vStats.overallPct ? 'فترة الجيش' : 'فترة الإجازة';
  const moreExhausted = (aStats.avgSleep>0 && vStats.avgSleep>0)
    ? (aStats.avgSleep < vStats.avgSleep ? 'فترة الجيش' : 'فترة الإجازة')
    : null;

  el.innerHTML = `
    <h2>الإحصائيات الموحدة</h2>
    <div class="report-grid">
      <div class="rline">أيام جيش مسجّلة<b>${aStats.recorded}/${ARMY_TOTAL_DAYS}</b></div>
      <div class="rline">أيام إجازة مسجّلة<b>${vStats.recordedDays}/10</b></div>
      <div class="rline">أطول سلسلة التزام<b>${combinedStreak} يوم</b></div>
      <div class="rline">متوسط النوم<b>${avgSleepCombined} ساعة</b></div>
      <div class="rline">جلسات مراجعة/مذاكرة<b>${aStats.reviewCount + vStats.tasksDone}</b></div>
      <div class="rline">مهام منجزة<b>${totalTasksDone}</b></div>
      <div class="rline">أهداف مكتملة<b>${totalGoalsDone}</b></div>
      <div class="rline">نسبة التوازن العام<b>${balancePct}%</b></div>
    </div>
    <ul class="insights-list">
      <li>أكتر فترة كنت منتظم فيها: ${moreConsistent}.</li>
      ${moreExhausted ? `<li>أكتر فترة كنت مرهق فيها (أقل نوم): ${moreExhausted}.</li>` : ''}
      <li>${verdict}</li>
    </ul>
  `;
}

function archiveCycle(mode){
  if(!confirm(mode==='army' ? 'هتبدأ دورة جيش جديدة وهتتحفظ الحالية في الأرشيف. متأكد؟' : 'هتبدأ إجازة جديدة وهتتحفظ الحالية في الأرشيف. متأكد؟')) return;

  if(mode==='army'){
    const aStats = computeArmyStats();
    state.archive.push({id:'ar'+(idCounter++), type:'army', label:'دورة جيش '+state.cycleLabels.army, archivedAt:new Date().toISOString(), summary:aStats});
    state.cycleLabels.army++;
    state.army = defaultArmyState();
  }else{
    const vStats = computeDashboardStats();
    state.archive.push({id:'ar'+(idCounter++), type:'vacation', label:'إجازة '+state.cycleLabels.vacation, archivedAt:new Date().toISOString(), summary:vStats});
    state.cycleLabels.vacation++;
    DAY_DEFS.forEach(def=> state[def.n] = defaultDayState(def));
    state.goals = [];
    state.timerSessions = [];
  }
  render(); saveState();
}

function svgBarChart(values, max, color){
  const w=320, h=64, n=values.length, gap=4;
  const barW = (w - gap*(n-1))/n;
  let bars='';
  values.forEach((v,i)=>{
    const bh = v>0 ? Math.max(3,(v/max)*h) : 1;
    const x = i*(barW+gap);
    const y = h-bh;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="${color}"></rect>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">${bars}</svg>`;
}

function renderReport(stats){
  const el = document.getElementById('report');
  const interactedDays = DAY_DEFS.filter(d=>isDayInteracted(d.n));
  if(!interactedDays.length){
    el.innerHTML = `<h2>تقرير الإجازة</h2><div class="note">لسه مفيش بيانات كفاية — ابدأ سجّل أول يوم وهيبان هنا تقرير كامل بالإحصائيات والرسوم.</div>`;
    return;
  }

  const pcts = DAY_DEFS.map(d=>dayPct(d.n));
  const sleepHours = DAY_DEFS.map(d=> state[d.n].sleep.hours || 0);
  const avgSleep = stats.avgSleep;

  const mostProductive = DAY_DEFS.reduce((best,d)=> dayPct(d.n) > dayPct(best.n) ? d : best, DAY_DEFS[0]);
  const leastActive = DAY_DEFS.filter(d=>isDayInteracted(d.n)).reduce((worst,d)=> (!worst || dayPct(d.n) < dayPct(worst.n)) ? d : worst, null);
  const mostRestDay = DAY_DEFS.reduce((best,d)=>{
    const dv = state[d.n].sleep.hours || 0;
    const bv = state[best.n].sleep.hours || 0;
    return dv > bv ? d : best;
  }, DAY_DEFS[0]);

  let bestTag=null, worstTag=null;
  Object.keys(stats.tagTotal).forEach(tag=>{
    if(stats.tagTotal[tag]<=0) return;
    if(bestTag===null || stats.tagDone[tag] > stats.tagDone[bestTag]) bestTag = tag;
    if(worstTag===null || stats.tagDone[tag] < stats.tagDone[worstTag]) worstTag = tag;
  });

  const successPct = Math.round(stats.goodDays/DAY_DEFS.length*100);

  const goalsSummary = computeGoalsSummary(stats);
  const achievedGoals = state.goals.filter(g=>computeGoalProgress(g, stats).done);
  const pendingGoals = state.goals.filter(g=>!computeGoalProgress(g, stats).done);

  const insights = [];
  insights.push(`أكتر يوم كنت فيه منتج: يوم ${mostProductive.n} (${dayPct(mostProductive.n)}%).`);
  if(leastActive) insights.push(`أقل يوم نشاطًا: يوم ${leastActive.n} (${dayPct(leastActive.n)}%).`);
  if(state.goals.length){
    insights.push(goalsSummary.achieved===goalsSummary.total
      ? 'حققت كل أهداف الإجازة اللي حددتها 🎉'
      : `حققت ${goalsSummary.achieved} من ${goalsSummary.total} أهداف (${goalsSummary.pct}%).`);
  }else{
    insights.push('لسه محددتش أهداف للإجازة — جرّب تضيف هدف أو اتنين فوق.');
  }
  if(avgSleep>0){
    insights.push(avgSleep>=7
      ? `متوسط نومك ${avgSleep} ساعة — كويس ومريح.`
      : `متوسط نومك ${avgSleep} ساعة بس — حاول تزود شوية لو قدرت.`);
  }

  el.innerHTML = `
    <h2>تقرير الإجازة</h2>
    <div class="report-grid">
      <div class="rline">أكتر يوم إنتاجية<b>يوم ${mostProductive.n} — ${dayPct(mostProductive.n)}%</b></div>
      <div class="rline">أكتر يوم راحة (نوم)<b>يوم ${mostRestDay.n}${state[mostRestDay.n].sleep.hours?(' — '+state[mostRestDay.n].sleep.hours+'س'):''}</b></div>
      <div class="rline">متوسط النوم<b>${avgSleep} ساعة</b></div>
      <div class="rline">متوسط الإنجاز<b>${stats.overallPct}%</b></div>
      <div class="rline">نسبة الأيام الناجحة<b>${successPct}%</b></div>
      <div class="rline">ساعات المذاكرة<b>${stats.studyHours} ساعة</b></div>
      <div class="rline">أكتر نوع مهام مُنجز<b>${bestTag?TAG_LABEL[bestTag]:'—'}</b></div>
      <div class="rline">أقل نوع مهام مُنجز<b>${worstTag?TAG_LABEL[worstTag]:'—'}</b></div>
    </div>

    <div class="chart-block">
      <div class="clabel">نسبة الإنجاز اليومية</div>
      ${svgBarChart(pcts, 100, 'var(--calm)')}
    </div>
    <div class="chart-block">
      <div class="clabel">ساعات النوم اليومية</div>
      ${svgBarChart(sleepHours, Math.max(8, ...sleepHours), 'var(--amber)')}
    </div>
    <div class="chart-block">
      <div class="clabel">المزاج خلال الإجازة</div>
      <div class="mood-chart">
        ${DAY_DEFS.map(d=>{
          const m = state[d.n].mood;
          const emoji = m ? MOOD_OPTIONS.find(x=>x.k===m).e : '—';
          return `<div class="mc">${emoji}</div>`;
        }).join('')}
      </div>
    </div>

    <div class="chart-block">
      <div class="clabel">الأهداف</div>
      ${state.goals.length ? `
        ${achievedGoals.map(g=>`<div class="rline">✅ ${g.label}</div>`).join('')}
        ${pendingGoals.map(g=>`<div class="rline">⏳ ${g.label}</div>`).join('')}
        <div class="note">نسبة تحقيق الأهداف الكلية: ${goalsSummary.pct}%</div>
      ` : `<div class="note">لسه محددتش أهداف — ضيفها فوق قبل بداية الإجازة.</div>`}
    </div>

    <div class="chart-block">
      <div class="clabel">ملاحظات ذكية</div>
      <ul class="insights-list">
        ${insights.map(i=>`<li>${i}</li>`).join('')}
      </ul>
    </div>
  `;
}

async function loadTheme(){
  try{
    const r = await Storage.get('vacation-theme', false);
    if(r && r.value==='dark'){
      document.documentElement.setAttribute('data-theme','dark');
      document.getElementById('themeBtn').textContent = '☀️';
      document.getElementById('themeBtnArmy').textContent = '☀️';
    }
  }catch(e){}
}
async function toggleTheme(){
  const isDark = document.documentElement.getAttribute('data-theme')==='dark';
  if(isDark){
    document.documentElement.removeAttribute('data-theme');
    document.getElementById('themeBtn').textContent = '🌙';
    document.getElementById('themeBtnArmy').textContent = '🌙';
    try{ await Storage.set('vacation-theme','light',false); }catch(e){}
  }else{
    document.documentElement.setAttribute('data-theme','dark');
    document.getElementById('themeBtn').textContent = '☀️';
    document.getElementById('themeBtnArmy').textContent = '☀️';

  }
}
document.getElementById('themeBtn').onclick = toggleTheme;
document.getElementById('themeBtnArmy').onclick = toggleTheme;

/* ============================= NOTIFICATIONS ============================= */

function maybeNotify(title, body){
  if(!state.notificationsEnabled) return;
  if(typeof Notification === 'undefined') return;
  if(Notification.permission === 'granted'){
    try{ new Notification(title, {body}); }catch(e){ /* ignore */ }
  }
}
async function enableNotifications(){
  if(typeof Notification === 'undefined'){
    alert('المتصفح ده مش بيدعم تنبيهات خارجية، هنكتفي بالتنبيهات الداخلية جوه التطبيق.');
    return;
  }
  try{
    const perm = await Notification.requestPermission();
    if(perm==='granted'){
      state.notificationsEnabled = true;
      saveState();
      alert('تم تفعيل التنبيهات — هنفكّرك بلطف لو نسيت تسجّل يومك.');
      maybeNotify('خطة الجيش والإجازة', 'التنبيهات شغالة دلوقتي 🎉');
    }else{
      alert('تم رفض الإذن — هنفضل نعرض التنبيهات جوه التطبيق بس.');
    }
  }catch(e){
    alert('مش قادر أفعّل التنبيهات هنا، هنكتفي بالتنبيهات الداخلية.');
  }
}
document.getElementById('notifBtn').onclick = enableNotifications;
document.getElementById('notifBtnArmy').onclick = enableNotifications;

};

/* ============================= BACKUP: EXPORT / IMPORT ============================= */

function exportBackup(){
  const payload = {
    version: 3,
    exportedAt: new Date().toISOString(),
    theme: document.documentElement.getAttribute('data-theme')==='dark' ? 'dark' : 'light',
    data: state
  };
  const json = JSON.stringify(payload, null, 2);
  const area = document.getElementById('backupArea');
  if(area) area.value = json;
  try{
    const a = document.createElement('a');
    a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(json);
    a.download = 'vacation-backup.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }catch(e){
    // download may be blocked in this environment — the textarea above still has the full JSON to copy manually
  }
}

async function importBackup(){
  const area = document.getElementById('backupArea');
  if(!area || !area.value.trim()){ alert('الصق نص النسخة الاحتياطية في الخانة الأول'); return; }
  let parsed;
  try{ parsed = JSON.parse(area.value); }
  catch(e){ alert('النص ده مش JSON صحيح'); return; }
  const data = parsed.data || parsed;
  if(!data || typeof data !== 'object'){ alert('البيانات مش سليمة'); return; }

  state = data;
  normalizeState();

  if(parsed.theme==='dark'){
    document.documentElement.setAttribute('data-theme','dark');
    document.getElementById('themeBtn').textContent = '☀️';
    try{ await Storage.set('vacation-theme','dark',false); }catch(e){}
  }else if(parsed.theme==='light'){
    document.documentElement.removeAttribute('data-theme');
    document.getElementById('themeBtn').textContent = '🌙';
    try{ await Storage.set('vacation-theme','light',false); }catch(e){}
  }

  await saveState();
  render();
  alert('تم استيراد النسخة الاحتياطية بنجاح.');
}

document.getElementById('exportBtn').onclick = exportBackup;
document.getElementById('importBtn').onclick = importBackup;
document.getElementById('archiveVacationBtn').onclick = ()=> archiveCycle('vacation');
document.getElementById('archiveArmyBtn').onclick = ()=> archiveCycle('army');

/* ============================= INIT ============================= */

(async function init(){
  await loadTheme();
  await loadState();
  render();

  // one gentle startup reminder if today's day (in the current mode) is still unrecorded
  if(state.mode==='army'){
    if(!isArmyDayInteracted(state.army.currentDay)){
      maybeNotify('وضع الجيش', 'لسه مسجلتش يوم '+state.army.currentDay+' — تسجيل خفيف مش هياخد دقيقة.');
    }
  }else{
    const unrecorded = DAY_DEFS.find(d=>!isDayInteracted(d.n));
    if(unrecorded){
      maybeNotify('خطة الانفكاك', 'لسه مسجلتش يوم '+unrecorded.n+' من الإجازة.');
    }
  }
})();
</script>

    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('./sw.js').catch(()=>{ /* offline caching unavailable, app still works online */ });
    });
  }
</script>
