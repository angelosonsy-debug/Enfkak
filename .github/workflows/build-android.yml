name: Build Android App (APK/AAB)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'www/**'
      - 'twa-manifest.json'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Read package id from twa-manifest.json
        id: pkg
        run: echo "id=$(jq -r .packageId twa-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Create signing keystore
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'enfkak123' }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || 'enfkak123' }}
        run: |
          keytool -genkeypair -v -keystore android.keystore -alias enfkak \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KEY_PASS" \
            -dname "CN=Enfkak App, OU=Dev, O=Enfkak, L=Cairo, ST=Cairo, C=EG"

      - name: Build Android package with Bubblewrap
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'enfkak123' }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || 'enfkak123' }}
        run: |
          bubblewrap build --skipPwaValidation \
            --ksPath android.keystore --ksAlias enfkak \
            --ksPass "$KS_PASS" --keyPass "$KEY_PASS"

      - name: Generate assetlinks.json (for TWA verification)
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'enfkak123' }}
        run: |
          FPR=$(keytool -list -v -keystore android.keystore -storepass "$KS_PASS" -alias enfkak | grep 'SHA256:' | head -n1 | awk '{print $2}')
          mkdir -p build-output
          cat > build-output/assetlinks.json << EOF
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "${{ steps.pkg.outputs.id }}",
              "sha256_cert_fingerprints": ["$FPR"]
            }
          }]
          EOF

      - name: Collect build output
        run: |
          mkdir -p build-output
          cp app-release-signed.apk build-output/ 2>/dev/null || echo "APK filename may differ - check the step log above and this run's workspace listing below."
          cp app-release-bundle.aab build-output/ 2>/dev/null || echo "AAB filename may differ - check the step log above and this run's workspace listing below."
          ls -la > build-output/workspace-listing.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: enfkak-android-build
          path: build-output/
